name: Release

# At a version tag (v0.0.1): `make verify` on Linux and macOS (TST-14), then the
# four targets of OPS-13, each built natively, into a GitHub release with
# checksums.txt, a cosign bundle and SLSA provenance, and the formula in
# yachiko/homebrew-tap (OPS-10, D5). The same pipeline as the owner's lege.
# Run by hand (workflow_dispatch), it verifies and builds only: a dry run.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Toolchain versions
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Verify
        run: make verify

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04 for an older glibc, so the binaries run on more distros.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, native: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, native: true }
          - { os: macos-15, target: aarch64-apple-darwin, native: true }
          # Intel Macs: built on the Apple Silicon runner, with Apple's own linker.
          - { os: macos-15, target: x86_64-apple-darwin, native: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Check the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Toolchain versions
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: ${{ matrix.target }}

      # Without test-endpoint; the target fails if test code got in (TST-1).
      - name: Build and package
        run: make dist TARGET=${{ matrix.target }}

      - name: Smoke test
        if: matrix.native
        run: ./dist/circitor version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/circitor_*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload archives
      id-token: write   # keyless cosign signing via OIDC
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum circitor_*.tar.gz > checksums.txt
          cat checksums.txt

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Keyless signature of checksums.txt as a single .sigstore.json bundle.
      # Verify with:
      #   cosign verify-blob \
      #     --bundle checksums.txt.sigstore.json \
      #     --certificate-identity-regexp 'https://github.com/yachiko/circitor/.github/workflows/release.yml@refs/tags/v.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     checksums.txt
      - name: Sign checksums
        run: cosign sign-blob --bundle dist/checksums.txt.sigstore.json dist/checksums.txt --yes

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "${prerelease[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: checksums
          path: dist/checksums.txt

      - name: Capture artifact hashes for provenance
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum circitor_*.tar.gz checksums.txt | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: release
    permissions:
      actions: read     # detect the workflow's run details
      id-token: write   # mint OIDC tokens to sign provenance
      contents: write   # attach the .intoto.jsonl asset to the release
    # Reusable workflow MUST be referenced by tag (not SHA) per SLSA rules.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true

  homebrew:
    needs: release
    # Prereleases (v0.1.0-rc.1) stay out of the tap.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: checksums

      # A short-lived installation token for the yachiko-homebrew-bot App,
      # scoped to yachiko/homebrew-tap; the default GITHUB_TOKEN can't push
      # outside this repository.
      - name: Mint Homebrew tap token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: yachiko
          repositories: homebrew-tap

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          repository: yachiko/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: tap

      - name: Write the formula
        run: |
          python3 .github/scripts/homebrew_formula.py "$GITHUB_REF_NAME" checksums.txt > tap/Formula/circitor.rb
          ruby -c tap/Formula/circitor.rb
          cat tap/Formula/circitor.rb

      - name: Commit to the tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          APP_SLUG: ${{ steps.tap-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          cd tap
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add Formula/circitor.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged"
            exit 0
          fi
          git commit -m "circitor $GITHUB_REF_NAME"
          git push

[package]
name = "circitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A local daemon that watches GitHub pull requests for coding agents"

[lib]
path = "src/lib.rs"

[[bin]]
name = "circitor"
path = "src/main.rs"

[[test]]
name = "real"
path = "tests/real/main.rs"
required-features = ["test-endpoint"]

[features]
default = []
test-endpoint = ["dep:apollo-compiler", "dep:tempfile"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "signal", "sync", "io-util", "fs"] }
axum = "0.8"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "service", "http1"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
semver = "1"
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
fastrand = "2"
nix = { version = "0.31", features = ["fs", "process", "signal", "user"] }
apollo-compiler = { version = "1", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
apollo-compiler = "1"
tempfile = "3"

# docs/02 §2, "Measured cost": viewer.pullRequests, light (no reviews, rollup state only), page 100.
# It stands alone: no frag.graphql.
query { viewer { pullRequests(first: 100, states: OPEN) { nodes { id number updatedAt state isDraft repository { nameWithOwner } commits(last: 1) { nodes { commit { oid statusCheckRollup { state } } } } } } } rateLimit { cost nodeCount } }
